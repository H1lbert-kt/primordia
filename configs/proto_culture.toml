# Predation context for the proto-culture stages (13+).
#
# Stage 12.5 (experiments/predator_survival) showed that with Config-only
# levers the predation ratchet breaks: bite_rate=12 plus a wider contact
# radius ("reach" variant) yields ~400 predation deaths/run and diet_max
# up to 0.495, while the default (bite_rate=4, contact_range=1.5) yields
# ~4 deaths/run. Defaults in primordia/config.py are left untouched so
# every pre-12.5 experiment reproduces bit-for-bit; stages 13+ load this
# file to work on a world where being bitten is a real, frequent risk.
#
# Stage 13 adds the signal treatment on top: signal_emit_cost > 0 makes
# the emit gate (output 3) a real energy decision. The Config default is
# 0 (the sigmoid gate never closes exactly, so a default cost would tax
# every creature); this file is where the price is set.
#
# Stage 16 note: the price drops from 0.5 to 0.05 — stage 14's price
# sweep showed 0.5 collapses the population (33 alive at 10k in stage 13)
# while 0.05 survives to 10k with the gate still being paid for. The
# donation treatment (donate_rate) is not set here: it is the experiment's
# variant axis (experiments/proto_culture), and its Config default is 0.
#
# Usage:  python run.py --config configs/proto_culture.toml ...
bite_rate = 12.0
contact_range = 2.5
signal_emit_cost = 0.05
